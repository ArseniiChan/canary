[project]
name = "canary"
version = "0.1.0"
description = "Single-signal unsupervised novelty study on SEC 10-K MD&A text, evaluated against six historical accounting frauds with strict out-of-sample evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Arsenii Chan" }]
license = { text = "MIT" }

dependencies = [
    "sec-edgar-downloader>=5.0.3",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "sentence-transformers>=2.7.0",
    "torch>=2.3.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
